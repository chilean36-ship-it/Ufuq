name = "ufuq-audio-uploader"
main = "worker.js"
compatibility_date = "2026-09-01"

# The variables (SUPABASE_URL, SUPABASE_ANON_KEY, ALLOWED_ORIGINS, PUBLIC_BASE_URL) are set in the Cloudflare dashboard
# (Workers → ufuq-audio-uploader → Settings → Variables). keep_vars makes every deploy keep them as they are,
# so deploying from this repo can never change the allowed origins or the public URL.
keep_vars = true

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "lesson-audio"

[functions.paymob-webhook]
verify_jwt = false

[functions.audio-proxy]
verify_jwt = false

[functions.board-image]
verify_jwt = false

# Called only by the weekly GitHub Action; it proves itself with the x-cron-secret header instead of a user JWT.
[functions.cleanup-task-files]
verify_jwt = false

# Used by the Supabase CLI (and by .github/workflows/deploy-functions.yml).
# Functions NOT listed here are deployed with JWT verification ON (the safe default).
# These three do their own authentication (webhook signature) or are public by design.
project_id = "ldbthwpikixtykwmvudy"

[functions.paymob-webhook]
verify_jwt = false

[functions.audio-proxy]
verify_jwt = false

[functions.board-image]
verify_jwt = false

# Called only by the weekly GitHub Action; it proves itself with the x-cron-secret header instead of a user JWT.
[functions.cleanup-task-files]
verify_jwt = false

# Owner-only Telegram bot: Telegram proves itself with the X-Telegram-Bot-Api-Secret-Token header.
[functions.tg-webhook]
verify_jwt = false

# Called only by pg_cron (job ufuq-bot-daily); it proves itself with the x-cron-secret header.
[functions.cron-monitor]
verify_jwt = false

# Student support bot: Telegram proves itself with the X-Telegram-Bot-Api-Secret-Token header.
[functions.support-bot]
verify_jwt = false

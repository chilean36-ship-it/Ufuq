name: Deploy Edge Functions

# Every push to main that touches supabase/functions/** (or supabase/config.toml) deploys the changed functions to the
# live Supabase project. A change in _shared/ or config.toml redeploys every function.
# Safety: it does nothing until supabase/functions/.synced exists (created by sync-functions.yml), so an outdated copy
# of a function can never overwrite the live one.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Functions to deploy, separated by spaces (e.g. "ai-chat ufuq-tts"). Write ALL to deploy every function - only after the repo copies were compared with the live ones.'
        required: true
        type: string

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: ldbthwpikixtykwmvudy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          MANUAL_FUNCTIONS: ${{ github.event.inputs.functions }}
        run: |
          if [ ! -f supabase/functions/.synced ]; then echo "Skipped: functions were not synced from Supabase yet (run the 'Sync functions from Supabase' workflow)."; exit 0; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing, nothing deployed"; exit 0; fi

          all_functions() { for d in supabase/functions/*/; do n=$(basename "$d"); case "$n" in _*) ;; *) echo "$n";; esac; done; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual run deploys only the functions named in the input; ALL is the explicit opt-in for every function.
            if [ "$MANUAL_FUNCTIONS" = "ALL" ]; then targets=$(all_functions); else targets="$MANUAL_FUNCTIONS"; fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No previous commit to compare with, nothing deployed. Run the workflow manually with the function names."; exit 0
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions supabase/config.toml)
            echo "$changed"
            # 1) functions whose own folder changed
            targets=$(echo "$changed" | grep -E '^supabase/functions/[^/_][^/]*/' | cut -d/ -f3 | sort -u)
            # 2) functions that import a changed _shared file
            for f in $(echo "$changed" | grep -E '^supabase/functions/_shared/' | xargs -r -n1 basename); do
              for d in $(all_functions); do
                if grep -rqs "_shared/$f" "supabase/functions/$d"; then targets="$targets
          $d"; fi
              done
            done
            # 3) functions whose [functions.NAME] block in config.toml was touched (e.g. verify_jwt)
            if echo "$changed" | grep -q '^supabase/config.toml$'; then
              cfg=$(git diff -U0 "$BEFORE" "$GITHUB_SHA" -- supabase/config.toml | grep -E '^[+-]\[functions\.' | sed -E 's/^[+-]\[functions\.([^]]+)\].*/\1/')
              targets="$targets
          $cfg"
            fi
            targets=$(echo "$targets" | tr ' ' '\n' | sed '/^$/d' | sort -u)
          fi
          echo "Functions to deploy: $(echo $targets)"

          failed=0
          for fn in $targets; do
            if [ ! -d "supabase/functions/$fn" ]; then echo "skip $fn (folder removed)"; continue; fi
            echo "== deploying $fn"
            # --yes: the CLI asks for confirmation before deploying and a CI run has no terminal to answer it.
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --yes || { echo "::error::deploy of $fn failed"; failed=1; }
          done
          exit $failed

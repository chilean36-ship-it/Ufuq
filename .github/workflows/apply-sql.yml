name: Apply SQL migration

# Runs migration files on the live project through the Supabase Management API (SUPABASE_ACCESS_TOKEN secret).
# - push: every file name listed in supabase/apply-queue.txt (one per line) is applied when that file changes.
#   Only idempotent migrations (create or replace / if not exists) belong in the queue.
# - manual: Actions → Run workflow → type one file name from supabase/migrations/.
on:
  push:
    branches: [main]
    paths: ['supabase/apply-queue.txt']
  workflow_dispatch:
    inputs:
      file:
        description: 'Migration file name, e.g. 20261126_certificates.sql'
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the migration(s)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_FILE:-}" ]; then files="$INPUT_FILE"; else files=$(grep -v '^\s*\(#\|$\)' supabase/apply-queue.txt); fi
          for FILE in $files; do
            case "$FILE" in */*|*..*) echo "file name only: $FILE"; exit 1;; esac
            test -f "supabase/migrations/$FILE"
            echo "== applying $FILE"
            body=$(jq -Rs '{query: .}' "supabase/migrations/$FILE")
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/ldbthwpikixtykwmvudy/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
            cat out.json; echo
            test "$code" -lt 300
          done

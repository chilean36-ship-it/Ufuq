name: Sync functions from Supabase

# One-off (re-runnable): downloads every Edge Function that is LIVE on Supabase into supabase/functions/ and pushes
# it to the branch "sync/live-functions". Review that branch, then merge it into main. After the first merge a marker
# file (supabase/functions/.synced) exists and deploy-functions.yml starts deploying on every push.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_REF: ldbthwpikixtykwmvudy

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download live functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first"; exit 1; fi
          supabase functions list --project-ref "$PROJECT_REF" -o json | jq -r '.[].slug' > /tmp/slugs.txt
          cat /tmp/slugs.txt
          while read -r slug; do
            echo "== $slug"
            supabase functions download "$slug" --project-ref "$PROJECT_REF" --use-api || echo "::warning::could not download $slug"
          done < /tmp/slugs.txt
          touch supabase/functions/.synced
      - name: Push branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b sync/live-functions
          git add -A supabase
          git commit -m "Sync Edge Functions from the live Supabase project" || echo "nothing changed"
          git push --force origin sync/live-functions

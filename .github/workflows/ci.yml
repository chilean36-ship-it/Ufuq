name: CI

# Runs on every push and pull request. Vercel (connected to this repository) deploys automatically:
# every push to the production branch goes live, every pull request gets its own preview URL.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Level system (groups, promotion, demotion): SQL test on a throw-away Postgres of the runner. Never touches Supabase.
  level-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-level-sql.sh
